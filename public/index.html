<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

```
<title>Library Management System</title>

<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
```

</head>

<body>

```
<header>
    <h1>Library Management System</h1>
    <p>Manage your authors and books</p>
</header>

<main>

    <p id="message" role="status" aria-live="polite"></p>

    <!-- Add Author -->
    <section class="card">
        <h2>Add Author</h2>

        <form id="authorForm">

            <label for="authorName">Author Name</label>

            <input
                type="text"
                id="authorName"
                placeholder="Enter author name"
                required
            >

            <label for="authorCountry">Country</label>

            <input
                type="text"
                id="authorCountry"
                placeholder="Enter country"
                required
            >

            <button type="submit">Add Author</button>

        </form>
    </section>

    <!-- Authors Table -->
    <section class="card">

        <h2>Authors</h2>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>Author ID</th>
                        <th>Name</th>
                        <th>Country</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="authorsList"></tbody>
            </table>

        </div>
    </section>

    <!-- Add Book -->
    <section class="card">

        <h2>Add Book</h2>

        <form id="bookForm">

            <label for="bookTitle">Book Title</label>

            <input
                type="text"
                id="bookTitle"
                placeholder="Enter book title"
                required
            >

            <label for="bookPrice">Price</label>

            <input
                type="number"
                id="bookPrice"
                placeholder="Enter price"
                min="0"
                step="0.01"
                required
            >

            <label for="bookAuthor">Author</label>

            <select id="bookAuthor" required>
                <option value="">Select author</option>
            </select>

            <button type="submit">Add Book</button>

        </form>
    </section>

    <!-- Books Table -->
    <section class="card">

        <h2>Books</h2>

        <div class="table-container">

            <table>
                <thead>
                    <tr>
                        <th>Book ID</th>
                        <th>Title</th>
                        <th>Price</th>
                        <th>Author ID</th>
                        <th>Author Name</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="booksList"></tbody>
            </table>

        </div>
    </section>

</main>

<footer>
    <p>Database Lab 3 - Library Management System</p>
</footer>
```

</body>
</html>
